<script>
// Get the form
const form = document.querySelector('form[action="login.php"]');

// Create popup container
const popup = document.createElement('div');
popup.id = 'popupMessage';
document.body.appendChild(popup);

// CSS for popup
const style = document.createElement('style');
style.textContent = `
#popupMessage {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 15px 25px;
    background-color: #f44336;
    color: white;
    font-family: Arial, sans-serif;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    z-index: 1000;
    display: none;
    opacity: 0;
    transition: all 0.5s ease;
}
#popupMessage.success { background-color: #4CAF50; }
#popupMessage.show { display: block; opacity: 1; }
`;
document.head.appendChild(style);

// Handle login form via AJAX
form.addEventListener('submit', async (e) => {
    e.preventDefault(); // prevent page reload

    const formData = new FormData(form);

    const res = await fetch('login.php', { method: 'POST', body: formData });
    const data = await res.json();

    // Show popup
    popup.textContent = data.message;
    popup.className = '';
    popup.classList.add(data.status, 'show');

    // Hide popup after 3 seconds
    setTimeout(() => {
        popup.classList.remove('show');

        // Redirect after success
        if (data.status === 'success') {
            window.location.href = 'index.php';
        }
    }, 1500);
});
</script>
