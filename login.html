<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bustle</title>
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="index.js" defer></script>
    <style>
       @import url('https://fonts.googleapis.com/css2?family=Caprasimo&family=DM+Serif+Display:ital@0;1&family=Outfit:wght@200&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loading"></div>
    </div>
        <section>
        <div class="Navigation">
            <div id="logo" class="hidden-text" data-anim="fade-up">
                <a href="index.php">Bustle</a>
            </div>
        </div>
        <div id="container" class="hidden-text" data-anim="fade-up">
            <div class="form-box loginBox">
                <form action="login.php" method="POST">
                    <h1>Login</h1>
                    <div class="inputBox">
                        <input type="text" name="username" placeholder="Username" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="inputBox">
                        <input type="password" name="password" placeholder="Password" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <div class="forgetPass">
                        <a href="#">Forget Password</a>
                    </div>
                    <button type="submit" class="submitBtn">Login</button>
                    <p>or Login with social platforms</p>
                    <div class="socials">
                        <a href=""><i class="fa-brands fa-google"></i></a>
                        <a href=""><i class="fa-brands fa-facebook"></i></a>
                        <a href=""><i class="fa-brands fa-github"></i></a>
                    </div>
                </form>
            </div>
            <div class="toggleBox">
                <div class="toggle-panel toggle-left">
                    <h1>Hello, Welcome!</h1>
                    <p>Don't have an account?</p>
                    <a href="Register.html"><button class="btn Registbtn">Register</button></a>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Hello, Welcome!</h1>
                    <p>Already have an account?</p>
                    <button class="btn Loginbtn"Login>Login</button>
                </div>
            </div>
        </div>
    </section>
<script>
// Get the form
const form = document.querySelector('form[action="login.php"]');

// Create popup container
const popup = document.createElement('div');
popup.id = 'popupMessage';
document.body.appendChild(popup);

// CSS for popup
const style = document.createElement('style');
style.textContent = `
#popupMessage {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 15px 25px;
    background-color: #f44336;
    color: white;
    font-family: Arial, sans-serif;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    z-index: 1000;
    display: none;
    opacity: 0;
    transition: all 0.5s ease;
}
#popupMessage.success { background-color: #4CAF50; }
#popupMessage.show { display: block; opacity: 1; }
`;
document.head.appendChild(style);

// Handle login form via AJAX
form.addEventListener('submit', async (e) => {
    e.preventDefault(); // prevent page reload

    const formData = new FormData(form);

    const res = await fetch('login.php', { method: 'POST', body: formData });
    const data = await res.json();

    // Show popup
    popup.textContent = data.message;
    popup.className = '';
    popup.classList.add(data.status, 'show');

    // Hide popup after 3 seconds
    setTimeout(() => {
        popup.classList.remove('show');

        // Redirect after success
        if (data.status === 'success') {
            window.location.href = 'index.php';
        }
    }, 1500);
});
</script>
    </body>
</html>
