<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bustle</title>
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="index.js" defer></script>
    <style>
       @import url('https://fonts.googleapis.com/css2?family=Caprasimo&family=DM+Serif+Display:ital@0;1&family=Outfit:wght@200&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loading"></div>
    </div>
        <section>
        <div class="Navigation">
            <div id="logo" class="hidden-text" data-anim="fade-up">
                <a href="index.html">Bustle</a>
            </div>
        </div>
        <div id="container" class="hidden-text" data-anim="fade-up">
            <div class="form-box loginBox">
                <form action="#">
                    <h1>Login</h1>
                    <div class="inputBox">
                        <input type="text" placeholder="Username" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="inputBox">
                        <input type="text" placeholder="Password" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <div class="forgetPass">
                        <a href="#">Forget Password</a>
                    </div>
                    <button type="submit" class="submitBtn">Login</button>
                    <p>or Login with social platforms</p>
                    <div class="socials">
                        <a href=""><i class="fa-brands fa-google"></i></a>
                        <a href=""><i class="fa-brands fa-facebook"></i></a>
                        <a href=""><i class="fa-brands fa-github"></i></a>
                    </div>
                </form>
            </div>
            <!--Register-->
            <div class="Register">
                <div class="form-box registerBox">
                <form action="#">
                    <h1>Registration</h1>
                    <div class="inputBox">
                        <input type="text" placeholder="Username" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="inputBox">
                        <input type="email" placeholder="Email" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div class="inputBox">
                        <input type="password" placeholder="Password" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <button type="submit" class="submitBtn">Register</button>
                    <p>or Register with social platforms</p>
                    <div class="socials">
                        <a href=""><i class="fa-brands fa-google"></i></a>
                        <a href=""><i class="fa-brands fa-facebook"></i></a>
                        <a href=""><i class="fa-brands fa-github"></i></a>
                    </div>
                </form>
            </div>
            <div class="toggleBox">
                <div class="toggle-panel toggle-left">
                    <h1>Hello, Welcome!</h1>
                    <p>Don't have an account?</p>
                    <button class="btn Registbtn">Register</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Hello, Welcome!</h1>
                    <p>Already have an account?</p>
                    <button class="btn Loginbtn"Login>Login</button>
                </div>
            </div>
        </div>
    </section>
    </body>
</html>
