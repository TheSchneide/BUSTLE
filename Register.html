    <script>
// Get the form and popup container
const form = document.querySelector('form[action="register.php"]');
const popup = document.createElement('div');
popup.id = 'popupMessage';
document.body.appendChild(popup);

// Handle form submission
form.addEventListener('submit', async (e) => {
    e.preventDefault(); // prevent normal submission

    const formData = new FormData(form);

    const response = await fetch('register.php', {
        method: 'POST',
        body: formData
    });

    const data = await response.json();

    // Show popup
    popup.textContent = data.message;
    popup.className = ''; // reset classes
    popup.classList.add(data.status, 'show');

    // Hide popup after 3 seconds
    setTimeout(() => {
        popup.classList.remove('show');

        // Redirect to index.html if registration succeeded
        if (data.status === 'success') {
            window.location.href = 'index.php';
        }
    }, 1500);

    // Optionally clear form on success
    if (data.status === 'success') {
        form.reset();
    }
});
</script>
