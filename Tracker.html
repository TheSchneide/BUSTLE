<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bustle</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
    </script>
    <style>
       @import url('https://fonts.googleapis.com/css2?family=Caprasimo&family=DM+Serif+Display:ital@0;1&family=Outfit:wght@200&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');
       #map { height: 750px; }
    </style>
</head>
<body>
    <header>
        <div class="Navigation">
            <div id="logo" data-anim="fade-up">
                <a href="index.html">Bustle</a>
            </div>
            <div id="navBar" data-anim="fade-up">
                <a href="index.html">Home</a>
                <a href="Tracker.html" class="tracker">Tracker</a>
            </div>
        </div>
        <div id="map"></div>
        </header>
    <footer>
        <a href="index.html">@Bustle.com</a>
        <a href="">BustleCrew@gmail.com</a>
        <a href="">+091234567</a>
    </footer>
    <script>
    navigator.geolocation.getCurrentPosition(async (position) => {
        let { latitude, longitude } = position.coords;

        var map = L.map('map').setView([latitude, longitude], 13);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Mark user's current location
        L.marker([latitude, longitude]).addTo(map).bindPopup("You are here").openPopup();

        // Bus icon
        var busIcon = L.icon({
            iconUrl: 'busIcon.png',
            iconSize: [100, 95],
            iconAnchor: [22, 94],
            popupAnchor: [-3, -76]
        });

        // Example bus location
        var bus = [10.3315, 123.90643];

        // Ordered bus stops
        var stops = [
            [10.32853, 123.9088],
            [10.33941, 123.9115],
            [10.354847, 123.914696],
            [10.3519, 123.9138],
            [10.360, 123.9165],
            [10.354636, 123.921072],
            [10.352872, 123.922684],
            [10.350284, 123.924797],
            [10.349241, 123.925624],
            [10.347291, 123.928041],
            [10.346524, 123.929341],
            [10.345279, 123.930602],
            [10.342883, 123.932878],
            [10.340230, 123.935520],
            [10.338017, 123.937100],
            [10.335997, 123.938579]
        ];

        // Find nearest stop to the user
        let nearestStop = stops[0];
        let minDist = Infinity;
        stops.forEach(stop => {
            const d = map.distance(stop, [latitude, longitude]);
            if (d < minDist) {
                minDist = d;
                nearestStop = stop;
            }
        });

        // Show all stops
        stops.forEach(stop => {
            L.circleMarker(stop, { color: 'green' })
                .addTo(map)
                .bindPopup("Bus Stop");
        });

        // Build coordinates for full route: bus → all stops → nearest stop
        let waypoints = [bus, ...stops, nearestStop];

        // OSRM expects coordinates as lng,lat
        let coords = waypoints.map(p => `${p[1]},${p[0]}`).join(';');
        const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`;

        const response = await fetch(url);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
            const route = data.routes[0];
            const distance = route.distance;
            const duration = route.duration;
            const etaMinutes = (duration / 60).toFixed(1);

            // Draw the full bus route (through all stops)
            L.geoJSON(route.geometry, { style: { color: 'blue', weight: 4 } }).addTo(map);

            // Mark the bus
            L.marker(bus, { icon: busIcon })
                .addTo(map)
                .bindPopup(`Final stop ETA: ${etaMinutes} min<br>Distance: ${(distance / 1000).toFixed(2)} km`)
                .openPopup();

            // Optional: route from user's nearest stop to their exact location (dotted line)
            const stopToUserURL = `https://router.project-osrm.org/route/v1/driving/${nearestStop[1]},${nearestStop[0]};${longitude},${latitude}?overview=full&geometries=geojson`;
            const stopToUserResp = await fetch(stopToUserURL);
            const stopToUserData = await stopToUserResp.json();

            if (stopToUserData.routes && stopToUserData.routes.length > 0) {
                L.geoJSON(stopToUserData.routes[0].geometry, {
                    style: { color: 'orange', dashArray: '4 8' }
                }).addTo(map);
            }
        }
    });
    </script>



    </body>
</html>
