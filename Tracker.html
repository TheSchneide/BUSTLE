<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bustle - Fare Calculator</title>
    <link rel="stylesheet" href="tracker.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
        </script>
</head>

<body>
    <header>
        <div class="Navigation">
            <div id="logo" data-anim="fade-up">
                <a href="index.php">Bustle</a>
            </div>
            <div id="navBar" data-anim="fade-up">
                <a href="index.php">Home</a>
                <a href="logout.php" class="tracker">Logout</a>
            </div>
        </div>
        <div id="map"></div>
        <button id="openModalBtn" class="openModalBtn">Calculate Fare</button>
    </header>

    <div class="modalInfo">
        <div class="modalContent">
            <span class="close">&times;</span>
            <h2>Trip Fare Calculator</h2>
            
            <div class="input-group">
                <label>Pick-up Location</label>
                <div class="search-wrapper">
                    <input type="text" id="pickupInput" placeholder="Type location (e.g. Mactan Shrine)..." autocomplete="off">
                    <div id="pickupSuggestions" class="suggestions-list"></div>
                </div>
                <select id="pickupSelect" style="display:none;"></select>
                <div id="pickupMsg" class="fare-details" style="margin-top:5px; color:#666;"></div>
            </div>

            <div class="input-group">
                <label>Destination</label>
                <div class="search-wrapper">
                    <input type="text" id="destInput" placeholder="Type location (e.g. Ayala)..." autocomplete="off">
                    <div id="destSuggestions" class="suggestions-list"></div>
                </div>
                <select id="destSelect" style="display:none;"></select>
                <div id="destMsg" class="fare-details" style="margin-top:5px; color:#666;"></div>
            </div>

            <div id="fareResult" class="fare-display">
                ₱ 0.00
                <span class="fare-details">Select locations to calculate</span>
            </div>
        </div>
    </div>

    <footer>
        <a href="index.php">@Bustle.com</a>
        <a href="">BustleCrew@gmail.com</a>
        <a href="">+091234567</a>
    </footer>

    <script>
        // --- Configuration ---
        const baseFare = 15.00;       
        const perKmRate = 2.50;       
        // ---------------------

        const map = L.map('map').setView([10.32853, 123.9089], 13); 

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        const stops = [
            [10.32853, 123.9089], [10.33941, 123.9116], [10.354847, 123.914696],
            [10.3519, 123.91386], [10.36, 123.91653], [10.354636, 123.921072],
            [10.352872, 123.922684], [10.350284, 123.924797], [10.349241, 123.925624],
            [10.347291, 123.928041], [10.346524, 123.929341], [10.345279, 123.930602],
            [10.342883, 123.932878], [10.340230, 123.935520], [10.338017, 123.937100],
            [10.335997, 123.938579], [10.338196, 123.944092], [10.340796, 123.949214],
            [10.340896, 123.949214], [10.339409, 123.953100], [10.339509, 123.953100],
            [10.333641, 123.961298], [10.333741, 123.961298], [10.323553, 123.972286],
            [10.326384, 123.977480], [10.331931, 123.987888], [10.331064, 123.988999],
            [10.319322, 123.995067], [10.317076, 123.998081], [10.314963, 124.001165],
            [10.311924, 124.005914], [10.310542, 124.009324], [10.308596, 124.010744]
        ];

        // Add markers for all stops initially
        stops.forEach((stop, index) => {
            L.circleMarker(stop, { color: 'green', radius: 4 }).addTo(map)
                .bindPopup(`Bus Stop #${index + 1}`);
        });

        let currentRouteLayer = null;
        let searchMarkers = { pickup: null, dest: null };
        let debounceTimer;

        // --- AUTOCOMPLETE LOGIC ---
        
        document.getElementById('pickupInput').addEventListener('input', (e) => handleInput(e, 'pickupSuggestions', 'pickup'));
        document.getElementById('destInput').addEventListener('input', (e) => handleInput(e, 'destSuggestions', 'dest'));

        function handleInput(e, listId, type) {
            clearTimeout(debounceTimer);
            const query = e.target.value;
            const list = document.getElementById(listId);

            if (query.length < 3) {
                list.style.display = 'none';
                return;
            }

            // Debounce to prevent too many API calls
            debounceTimer = setTimeout(() => {
                fetchSuggestions(query, list, type);
            }, 300);
        }

        async function fetchSuggestions(query, listElement, type) {
            // Viewbox for Cebu & Lapu-Lapu area
            // approximate box: left,top,right,bottom
            const viewbox = '123.70,10.50,124.10,10.10'; 
            
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=ph&viewbox=${viewbox}&bounded=1&limit=5`;

            try {
                const response = await fetch(url);
                const results = await response.json();

                listElement.innerHTML = ''; // clear old results

                if (results.length > 0) {
                    listElement.style.display = 'block';
                    results.forEach(place => {
                        const div = document.createElement('div');
                        // Split name to make it cleaner
                        const displayName = place.display_name.split(',')[0]; 
                        const details = place.display_name.split(',').slice(1, 3).join(',');

                        div.innerHTML = `<strong>${displayName}</strong><small>${details}</small>`;
                        
                        div.addEventListener('click', () => {
                            selectPlace(place, type);
                            listElement.style.display = 'none';
                        });
                        listElement.appendChild(div);
                    });
                } else {
                    listElement.style.display = 'none';
                }
            } catch (err) {
                console.error("Search error", err);
            }
        }

        function selectPlace(place, type) {
            const lat = parseFloat(place.lat);
            const lon = parseFloat(place.lon);
            const input = document.getElementById(type + 'Input');
            const msg = document.getElementById(type + 'Msg');
            
            // Set input value to the selected name
            input.value = place.display_name.split(',')[0];

            // 1. Find Nearest Bus Stop
            let nearestIndex = -1;
            let minDistance = Infinity;

            stops.forEach((stop, index) => {
                const dist = map.distance([lat, lon], stop);
                if (dist < minDistance) {
                    minDistance = dist;
                    nearestIndex = index;
                }
            });

            // 2. Store selection (using hidden logic or variables)
            if (type === 'pickup') {
                window.pickupIndex = nearestIndex;
            } else {
                window.destIndex = nearestIndex;
            }

            // 3. Show feedback
            const distanceToStop = (minDistance / 1000).toFixed(2);
            msg.innerText = `Nearest Stop: #${nearestIndex + 1} (${distanceToStop}km away)`;

            // 4. Update Map Marker
            if (searchMarkers[type]) map.removeLayer(searchMarkers[type]);
            
            searchMarkers[type] = L.marker([lat, lon]).addTo(map)
                .bindPopup(`<b>${type === 'pickup' ? 'Pick-up' : 'Destination'}</b><br>${input.value}`)
                .openPopup();
            
            map.setView([lat, lon], 14);

            // 5. Trigger Calc if both are set
            calculateFare();
        }

        // --- FARE CALCULATION ---
        async function calculateFare() {
            // Check if both global indices are set (non-undefined)
            if (typeof window.pickupIndex === 'undefined' || typeof window.destIndex === 'undefined') return;

            const pIndex = window.pickupIndex;
            const dIndex = window.destIndex;
            const resultDisplay = document.getElementById('fareResult');

            if (pIndex === dIndex) {
                resultDisplay.innerHTML = `₱ 0.00 <span class="fare-details">Start and End are same stop</span>`;
                if(currentRouteLayer) map.removeLayer(currentRouteLayer);
                return;
            }

            resultDisplay.innerHTML = `Calculating... <span class="fare-details">Tracing route...</span>`;
            if (currentRouteLayer) map.removeLayer(currentRouteLayer);

            // Slice stops array
            let routeStops = [];
            if (pIndex < dIndex) {
                routeStops = stops.slice(pIndex, dIndex + 1);
            } else {
                routeStops = stops.slice(dIndex, pIndex + 1).reverse();
            }

            const coordsString = routeStops.map(s => `${s[1]},${s[0]}`).join(';');
            const routeURL = `https://router.project-osrm.org/route/v1/driving/${coordsString}?overview=full&geometries=geojson`;

            try {
                const response = await fetch(routeURL);
                const data = await response.json();

                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const distanceKm = route.distance / 1000;
                    let totalFare = baseFare + (distanceKm * perKmRate);

                    resultDisplay.innerHTML = `
                        ₱ ${totalFare.toFixed(2)}
                        <span class="fare-details">Route Distance: ${distanceKm.toFixed(2)} km</span>
                    `;

                    currentRouteLayer = L.geoJSON(route.geometry, {
                        style: { color: 'blue', weight: 4, opacity: 0.7 }
                    }).addTo(map);

                    map.fitBounds(currentRouteLayer.getBounds(), { padding: [50, 50] });
                }
            } catch (error) {
                resultDisplay.innerHTML = `Error <span class="fare-details">Connection failed</span>`;
            }
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                document.querySelectorAll('.suggestions-list').forEach(el => el.style.display = 'none');
            }
        });

        // Modal Logic
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.querySelector('.modalInfo');
            const closeBtn = document.querySelector('.close');
            const openBtn = document.getElementById('openModalBtn');

            function openModal() { modal.classList.add('active'); openBtn.style.display = "none"; }
            function closeModal() {
                modal.classList.add('closing');
                setTimeout(() => { modal.classList.remove('active', 'closing'); openBtn.style.display = "block"; }, 300);
            }

            openBtn.addEventListener('click', openModal);
            closeBtn.addEventListener('click', closeModal);
            window.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        });
    </script>
</body>
</html>
