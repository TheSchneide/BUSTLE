<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bustle</title>
    <link rel="stylesheet" href="tracker.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
        </script>
</head>

<body>
    <header>
        <div class="Navigation">
            <div id="logo" data-anim="fade-up">
                <a href="index.php">Bustle</a>
            </div>
            <div id="navBar" data-anim="fade-up">
                <a href="index.php">Home</a>
                <a href="logout.php" class="tracker">Logout</a>
            </div>
        </div>
        <div id="map"></div>
    </header>
    <footer>
        <a href="index.php">@Bustle.com</a>
        <a href="">BustleCrew@gmail.com</a>
        <a href="">+091234567</a>
    </footer>

    <script>
        navigator.geolocation.getCurrentPosition(async (position) => {
            let { latitude, longitude } = position.coords;

            const map = L.map('map').setView([latitude, longitude], 13);

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            L.marker([latitude, longitude]).addTo(map).bindPopup("You are here").openPopup();

            const busIcon = L.icon({
                iconUrl: 'busIcon.png',
                iconSize: [100, 95],
                iconAnchor: [22, 94],
                popupAnchor: [-3, -76]
            });

            const stops = [
                [10.32853, 123.9089],
                [10.33941, 123.9116],
                [10.354847, 123.914696],
                [10.3519, 123.91386],
                [10.36, 123.91653],
                [10.354636, 123.921072],
                [10.352872, 123.922684],
                [10.350284, 123.924797],
                [10.349241, 123.925624],
                [10.347291, 123.928041],
                [10.346524, 123.929341],
                [10.345279, 123.930602],
                [10.342883, 123.932878],
                [10.340230, 123.935520],
                [10.338017, 123.937100],
                [10.335997, 123.938579],
                [10.338196, 123.944092],
                [10.340796, 123.949214],
                [10.339409, 123.953100],
                [10.333641, 123.961298],
                [10.323553, 123.972286],
                [10.326384, 123.977480],
                [10.331931, 123.987888],
                [10.331064, 123.988999],
                [10.319322, 123.995067],
                [10.317076, 123.998081],
                [10.314963, 124.001165],
                [10.311924, 124.005914],
                [10.310542, 124.009324],
                [10.308596, 124.010744]
            ];

            const arrivalThreshold = 20;

            let busMarkers = {};
            let busRoutes = {};
            let stopMarkers = stops.map(stop => {
                return L.circleMarker(stop, { color: 'green' })
                    .addTo(map)
                    .bindPopup("Bus Stop");
            });

            // Find nearest stop to user
            const nearestStop = stops.reduce((prev, curr) => {
                return map.distance(curr, [latitude, longitude]) < map.distance(prev, [latitude, longitude]) ? curr : prev;
            });

            L.circleMarker(nearestStop, { color: 'orange' })
                .addTo(map)
                .bindPopup("Nearest Bus Stop to You")
                .openPopup();

            // Draw walking route from user to nearest stop
            const walkingRouteURL = `https://router.project-osrm.org/route/v1/foot/${longitude},${latitude};${nearestStop[1]},${nearestStop[0]}?overview=full&geometries=geojson`;
            const walkingResp = await fetch(walkingRouteURL);
            const walkingData = await walkingResp.json();

            if (walkingData.routes && walkingData.routes.length > 0) {
                const walkingRoute = walkingData.routes[0];

                // Convert seconds → minutes and adjust for realistic walking pace (1.4x slower)
                const walkingTimeMinutes = ((walkingRoute.duration * 1.4) / 60).toFixed(1);

                L.geoJSON(walkingRoute.geometry, {
                    style: { color: 'purple', weight: 4, dashArray: '5,10' }
                }).addTo(map)
                    .bindPopup(`Walking route to nearest stop: ${walkingTimeMinutes} min`)
                    .openPopup();
            }



            // Fetch and update bus positions + routes
            async function updateBuses() {
                const response = await fetch('get_buses.php');
                const buses = await response.json();

                // Update stop popups if bus is near
                stopMarkers.forEach((marker, i) => {
                    const stop = stops[i];
                    const busAtStop = buses.some(bus => {
                        if (!bus.latitude || !bus.longitude) return false;
                        return map.distance([parseFloat(bus.latitude), parseFloat(bus.longitude)], stop) <= arrivalThreshold;
                    });
                    marker.setPopupContent(busAtStop ? "Bus has arrived!" : "Bus Stop");
                });

                for (let bus of buses) {
                    if (!bus.latitude || !bus.longitude) continue;
                    const busPos = [parseFloat(bus.latitude), parseFloat(bus.longitude)];

                    // Update or create bus marker
                    if (busMarkers[bus.bus_id]) {
                        busMarkers[bus.bus_id].setLatLng(busPos);
                    } else {
                        busMarkers[bus.bus_id] = L.marker(busPos, { icon: busIcon }).addTo(map);
                    }

                    // Filter stops between bus and user's nearest stop
                    const stopsToRoute = stops.filter(stop => {
                        const distBusToStop = map.distance(busPos, stop);
                        const distStopToNearest = map.distance(stop, nearestStop);
                        const distBusToNearest = map.distance(busPos, nearestStop);
                        return distBusToStop < distBusToNearest && distStopToNearest < distBusToNearest;
                    });

                    // Build route: bus → filtered stops → nearest stop
                    const routePoints = [busPos, ...stopsToRoute, nearestStop];
                    const coords = routePoints.map(p => `${p[1]},${p[0]}`).join(';');
                    const routeURL = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`;

                    const routeResp = await fetch(routeURL);
                    const routeData = await routeResp.json();

                    if (routeData.routes && routeData.routes.length > 0) {
                        const route = routeData.routes[0];

                        // Remove old route if exists
                        if (busRoutes[bus.bus_id]) {
                            map.removeLayer(busRoutes[bus.bus_id]);
                        }

                        // Draw new route
                        busRoutes[bus.bus_id] = L.geoJSON(route.geometry, { style: { color: 'blue', weight: 4 } }).addTo(map);

                        // Update popup with ETA
                        const etaMinutes = (route.duration / 60).toFixed(1);
                        busMarkers[bus.bus_id].bindPopup(`
                            <b>Bus Plate:</b> ${bus.plate_number}<br>
                            <b>Route:</b> ${bus.route || 'N/A'}<br>
                            ETA to nearest stop: ${etaMinutes} min
                        `);
                    }
                }
            }

            updateBuses();
            setInterval(updateBuses, 5000); // refresh every 5 seconds
        });

        const toggle = document.getElementById('menu-toggle');
        const navBar = document.getElementById('navBar');

        toggle.addEventListener('click', () => {
            toggle.classList.toggle('active');
            navBar.classList.toggle('active');
        });

    </script>
</body>

</html>
