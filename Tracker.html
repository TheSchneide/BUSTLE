<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bustle - Fare Calculator</title>
    <link rel="stylesheet" href="tracker.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
        </script>
</head>

<body>
    <header>
        <div class="Navigation">
            <div id="logo" data-anim="fade-up">
                <a href="index.php">Bustle</a>
            </div>
            <div id="navBar" data-anim="fade-up">
                <a href="index.php">Home</a>
                <a href="logout.php" class="tracker">Logout</a>
            </div>
        </div>
        <div id="map"></div>
    </header>

    <!-- Dark overlay behind the sheet -->
    <div id="sheetOverlay" class="sheet-overlay"></div>

    <!-- Bottom Sheet Container -->
    <div id="bottomSheet" class="bottom-sheet">
        <div class="sheet-header" id="sheetHeader">
            <div class="sheet-handle-bar"></div>
            <h2 class="sheet-title">BUS</h2>
        </div>

        <div class="sheet-content">
            
            <!-- Pick Up Section -->
            <div class="input-group">
                <label class="input-label">Pick-up Point</label>
                <input type="text" id="pickupInput" class="clean-input" placeholder="Search location..." autocomplete="off">
                <div id="pickupSuggestions" class="suggestions-list"></div>
                <div class="divider"><span>OR SELECT STOP</span></div>
                <select id="pickupSelect" class="styled-select">
                    <option value="" disabled selected>-- Choose a Bus Stop --</option>
                </select>
                <div id="pickupMsg" class="helper-text"></div>
            </div>

            <!-- Destination Section -->
            <div class="input-group">
                <label class="input-label">Destination</label>
                <input type="text" id="destInput" class="clean-input" placeholder="Search location..." autocomplete="off">
                <div id="destSuggestions" class="suggestions-list"></div>
                <div class="divider"><span>OR SELECT STOP</span></div>
                <select id="destSelect" class="styled-select">
                    <option value="" disabled selected>-- Choose a Bus Stop --</option>
                </select>
                <div id="destMsg" class="helper-text"></div>
            </div>

            <!-- Student Toggle Switch -->
            <div class="toggle-container">
                <div class="toggle-label">
                    Student / PWD / Senior
                    <span class="toggle-sublabel">20% Discount applied</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="studentToggle">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Result Display -->
            <div id="fareResult" class="fare-display">
                ₱ 0
                <span class="fare-details">Select locations to calculate</span>
            </div>
        </div>
    </div>

    <footer>
        <a href="index.php">@Bustle.com</a>
        <a href="">BustleCrew@gmail.com</a>
        <a href="">+091234567</a>
    </footer>

    <script>
        // --- Logic Configuration ---
        // TARGETS:
        // 1. Base Fare: 13.00 (Student)
        // 2. 12.76 km -> 27.00
        // 3. 13.84 km -> 29.00
        // 4. 16.50 km -> 37.00
        
        // To fit these specific points, we adjust the Base Distance and Rate:
        const STUDENT_BASE_FARE = 13.00;
        const STUDENT_BASE_DIST = 7.4;    // The first 7.4km is covered by the base fare
        const STUDENT_EXCESS_RATE = 2.56; // Price per km after 7.4km

        // Regular Fare (Student / 0.80)
        const REGULAR_BASE_FARE = STUDENT_BASE_FARE / 0.8; 
        const REGULAR_EXCESS_RATE = STUDENT_EXCESS_RATE / 0.8;

        // ---------------------

        const map = L.map('map').setView([10.32853, 123.9089], 13); 

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        const stops = [
            [10.32853, 123.9089],
            [10.33941, 123.9116], 
            [10.3519, 123.91386],
            [10.354847, 123.914696],
            [10.36, 123.91653], [10.354636, 123.921072],
            [10.352872, 123.922684], [10.350284, 123.924797], [10.349241, 123.925624],
            [10.347291, 123.928041], [10.346524, 123.929341], [10.345279, 123.930602],
            [10.342883, 123.932878], [10.340230, 123.935520], [10.338017, 123.937100],
            [10.335997, 123.938579], [10.338196, 123.944092],
            // [10.340796, 123.949214],
            // [10.340896, 123.949214], 
            // [10.339409, 123.953100], 
            // [10.339509, 123.953100],
            // [10.333641, 123.961298],
            // [10.333741, 123.961298], 

            // [10.323553, 123.972286],
            // [10.326384, 123.977480], 
            [10.331931, 123.987888], [10.331064, 123.988999],
            [10.319322, 123.995067], [10.317076, 123.998081], [10.314963, 124.001165],
            [10.311924, 124.005914], [10.310542, 124.009324], [10.308596, 124.010744]
        ];

        const pickupSelect = document.getElementById('pickupSelect');
        const destSelect = document.getElementById('destSelect');
        const studentToggle = document.getElementById('studentToggle');

        stops.forEach((stop, index) => {
            const marker = L.circleMarker(stop, { color: 'green', radius: 4 }).addTo(map);
            marker.bindPopup(`Bus Stop #${index + 1}`);
            
            marker.on('mouseover', function (e) { this.openPopup(); });
            marker.on('mouseout', function (e) { this.closePopup(); });

            let opt = document.createElement("option");
            opt.value = index; 
            opt.text = `Bus Stop #${index + 1}`;
            pickupSelect.add(opt.cloneNode(true));
            destSelect.add(opt.cloneNode(true));
        });

        let currentRouteLayer = null;
        let searchMarkers = { pickup: null, dest: null };
        let debounceTimer;

        studentToggle.addEventListener('change', calculateFare);
        document.getElementById('pickupInput').addEventListener('input', (e) => handleInput(e, 'pickupSuggestions', 'pickup'));
        document.getElementById('destInput').addEventListener('input', (e) => handleInput(e, 'destSuggestions', 'dest'));

        function handleInput(e, listId, type) {
            clearTimeout(debounceTimer);
            const query = e.target.value;
            const list = document.getElementById(listId);
            if (query.length < 3) { list.style.display = 'none'; return; }
            debounceTimer = setTimeout(() => { fetchSuggestions(query, list, type); }, 300);
        }

        async function fetchSuggestions(query, listElement, type) {
            const viewbox = '123.70,10.50,124.10,10.10'; 
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=ph&viewbox=${viewbox}&bounded=1&limit=5`;
            try {
                const response = await fetch(url);
                const results = await response.json();
                listElement.innerHTML = ''; 
                if (results.length > 0) {
                    listElement.style.display = 'block';
                    results.forEach(place => {
                        const div = document.createElement('div');
                        const displayName = place.display_name.split(',')[0]; 
                        const details = place.display_name.split(',').slice(1, 3).join(',');
                        div.innerHTML = `<strong>${displayName}</strong><small>${details}</small>`;
                        div.addEventListener('click', () => { selectFromSearch(place, type); listElement.style.display = 'none'; });
                        listElement.appendChild(div);
                    });
                } else { listElement.style.display = 'none'; }
            } catch (err) { console.error("Search error", err); }
        }

        function selectFromSearch(place, type) {
            const lat = parseFloat(place.lat);
            const lon = parseFloat(place.lon);
            const input = document.getElementById(type + 'Input');
            const selectBox = document.getElementById(type + 'Select');
            const msg = document.getElementById(type + 'Msg');
            
            input.value = place.display_name.split(',')[0];
            let nearestIndex = -1; let minDistance = Infinity;
            stops.forEach((stop, index) => {
                const dist = map.distance([lat, lon], stop);
                if (dist < minDistance) { minDistance = dist; nearestIndex = index; }
            });
            if (nearestIndex !== -1) {
                selectBox.value = nearestIndex;
                msg.innerText = `Auto-selected Nearest Stop: #${nearestIndex + 1} (${(minDistance / 1000).toFixed(2)}km)`;
            }
            if (searchMarkers[type]) map.removeLayer(searchMarkers[type]);
            searchMarkers[type] = L.marker([lat, lon]).addTo(map).bindPopup(`<b>${type.toUpperCase()}</b><br>${input.value}`).openPopup();
            map.setView([lat, lon], 14);
            calculateFare();
        }

        pickupSelect.addEventListener('change', () => manualSelect('pickup'));
        destSelect.addEventListener('change', () => manualSelect('dest'));

        function manualSelect(type) {
            const selectBox = document.getElementById(type + 'Select');
            const input = document.getElementById(type + 'Input');
            const msg = document.getElementById(type + 'Msg');
            const index = selectBox.value;
            const stop = stops[index];
            input.value = ""; 
            msg.innerText = "Manual stop selection";
            if (searchMarkers[type]) map.removeLayer(searchMarkers[type]);
            map.setView(stop, 14);
            calculateFare();
        }

        async function calculateFare() {
            const pickupVal = pickupSelect.value;
            const destVal = destSelect.value;
            const resultDisplay = document.getElementById('fareResult');
            const isStudent = studentToggle.checked;

            if (pickupVal === "" || destVal === "") return;
            const pIndex = parseInt(pickupVal);
            const dIndex = parseInt(destVal);
            
            if (pIndex === dIndex) {
                resultDisplay.innerHTML = `₱ 0 <span class="fare-details">Start and End are same stop</span>`;
                if(currentRouteLayer) map.removeLayer(currentRouteLayer); return;
            }

            resultDisplay.innerHTML = `Calculating... <span class="fare-details">Tracing route...</span>`;
            if (currentRouteLayer) map.removeLayer(currentRouteLayer);
            
            let routeStops = [];
            if (pIndex < dIndex) { routeStops = stops.slice(pIndex, dIndex + 1); } 
            else { routeStops = stops.slice(dIndex, pIndex + 1).reverse(); }
            
            const coordsString = routeStops.map(s => `${s[1]},${s[0]}`).join(';');
            const routeURL = `https://router.project-osrm.org/route/v1/driving/${coordsString}?overview=full&geometries=geojson`;
            
            try {
                const response = await fetch(routeURL);
                const data = await response.json();
                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const distanceKm = route.distance / 1000;
                    
                    let fare = 0;
                    const excessDist = Math.max(0, distanceKm - STUDENT_BASE_DIST);

                    if (isStudent) {
                        fare = STUDENT_BASE_FARE + (excessDist * STUDENT_EXCESS_RATE);
                    } else {
                        // Regular fare calculation
                        const regularExcessDist = Math.max(0, distanceKm - STUDENT_BASE_DIST);
                        fare = REGULAR_BASE_FARE + (regularExcessDist * REGULAR_EXCESS_RATE);
                    }

                    const finalFare = Math.round(fare);

                    resultDisplay.innerHTML = `₱ ${finalFare}<span class="fare-details">Distance: ${distanceKm.toFixed(2)} km | ${isStudent ? 'Student' : 'Regular'}</span>`;
                    
                    currentRouteLayer = L.geoJSON(route.geometry, { style: { color: 'blue', weight: 4, opacity: 0.7 } }).addTo(map);
                    map.fitBounds(currentRouteLayer.getBounds(), { padding: [50, 50] });
                }
            } catch (error) { console.error(error); resultDisplay.innerHTML = `Error <span class="fare-details">Connection failed</span>`; }
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.input-group')) { document.querySelectorAll('.suggestions-list').forEach(el => el.style.display = 'none'); }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const bottomSheet = document.getElementById('bottomSheet');
            const sheetHeader = document.getElementById('sheetHeader');
            const sheetOverlay = document.getElementById('sheetOverlay');

            function toggleSheet() {
                bottomSheet.classList.toggle('expanded');
                sheetOverlay.classList.toggle('active');
            }
            sheetHeader.addEventListener('click', toggleSheet);
            sheetOverlay.addEventListener('click', () => {
                bottomSheet.classList.remove('expanded');
                sheetOverlay.classList.remove('active');
            });
        });
    </script>
</body>
</html>
